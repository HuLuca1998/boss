name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node BossAssistant/Tests/keyboard-runtime.cjs
          node BossAssistant/Tests/assistance-runtime.cjs
          node BossAssistant/Tests/location-runtime.cjs
          node BossAssistant/Tests/targeting-runtime.cjs
          swiftc BossAssistant/Sources/BossSelection.swift BossAssistant/Tests/BossSelectionTests.swift -o /tmp/boss-selection-tests
          /tmp/boss-selection-tests BossAssistant/Resources
          zsh scripts/test-update.sh
          swiftc BossAssistant/Sources/GameCachePolicy.swift BossAssistant/Tests/GameCachePolicyTests.swift -o /tmp/game-cache-tests
          /tmp/game-cache-tests BossAssistant/Resources
          swiftc -swift-version 5 BossAssistant/Sources/UpdatePolicy.swift BossAssistant/Updater/main.swift -o /tmp/BossAssistantUpdater -framework AppKit -framework Security
