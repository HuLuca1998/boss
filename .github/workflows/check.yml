name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm ci --prefix mcp
          npm test --prefix mcp
          node mcp/build.mjs
          node BossAssistant/Tests/keyboard-runtime.cjs
          node BossAssistant/Tests/assistance-runtime.cjs
          node BossAssistant/Tests/location-runtime.cjs
          node BossAssistant/Tests/targeting-runtime.cjs
          node BossAssistant/Tests/exploration-runtime.cjs
          swiftc BossAssistant/Sources/Bridge.swift BossAssistant/Tests/ExternalAPITests.swift -o /tmp/external-api-tests -framework Network
          node BossAssistant/Tests/external-api.cjs /tmp/external-api-tests
          swiftc BossAssistant/Sources/BossSelection.swift BossAssistant/Tests/BossSelectionTests.swift -o /tmp/boss-selection-tests
          /tmp/boss-selection-tests BossAssistant/Resources
          swiftc BossAssistant/Sources/HuntRestartSchedule.swift BossAssistant/Tests/HuntRestartTests.swift -o /tmp/hunt-restart-tests
          /tmp/hunt-restart-tests
          swiftc BossAssistant/Sources/RecoveryPolicy.swift BossAssistant/Sources/PopupRecord.swift BossAssistant/Sources/RedPacketLedger.swift BossAssistant/Tests/RecoveryPolicyTests.swift -o /tmp/recovery-tests
          /tmp/recovery-tests
          zsh scripts/test-update.sh
          swiftc BossAssistant/Sources/GameCachePolicy.swift BossAssistant/Sources/GameInstallation.swift BossAssistant/Tests/GameCachePolicyTests.swift -o /tmp/game-cache-tests
          /tmp/game-cache-tests BossAssistant/Resources
          swiftc -swift-version 5 BossAssistant/Sources/UpdatePolicy.swift BossAssistant/Updater/main.swift -o /tmp/BossAssistantUpdater -framework AppKit -framework Security
